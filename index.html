<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8">
<title>Oráculo v7.0 - 3 Camadas</title>
<style>body{font-family:sans-serif;padding:20px;max-width:700px;margin:auto} .card{background:#f9fafb;border:1px solid #e5e7eb;padding:16px;border-radius:12px;margin:10px 0} button{background:#111;color:white;padding:12px 20px;border:none;border-radius:8px;width:100%} select,input{width:100%;padding:10px;border-radius:8px;border:1px solid #ccc;margin:5px 0}</style>
</head>
<body>
<h1>Oráculo v7.0 - 3 Camadas</h1>
<p><small>Camada 1: biblioteca/BR/AL/alagoas.json | Camada 2: src/motores/motor_rural.js</small></p>
<div class="card">
<select id="mun"></select>
<input id="area" type="number" placeholder="Área em ha (ex: 6.07)" value="6.07">
<button onclick="testar()">Consultar Biblioteca Oficial</button>
</div>
<div id="out"></div>
<script type="module">
import {analisarRural} from './src/motores/motor_rural.js';
const sel=document.getElementById('mun');
fetch('./biblioteca/BR/AL/alagoas.json').then(r=>r.json()).then(d=>{
 d.sort((a,b)=>a.municipio.localeCompare(b.municipio)).forEach(m=>{
  const o=document.createElement('option');o.value=m.municipio;o.textContent=`${m.municipio} - MF ${m.modulo_fiscal_ha}ha`;sel.appendChild(o);
  if(m.municipio==='JAPARATINGA') sel.value=m.municipio;
 });
});
window.testar=async()=>{
 const res=await analisarRural({municipio:sel.value, uf:'AL', area_ha: parseFloat(document.getElementById('area').value)});
 document.getElementById('out').innerHTML=`<div class="card"><pre>${JSON.stringify(res,null,2)}</pre></div>`;
};
</script>
</body></html>
