<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Oráculo v7.1 FINAL</title><style>body{font-family:system-ui;padding:16px;background:#0f172a;color:#e2e8f0;max-width:700px;margin:auto}.card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:14px;margin:10px 0}select,input{width:100%;padding:12px;border-radius:8px;border:1px solid #334155;background:#0b1220;color:#fff;font-size:16px;margin-top:6px}button{width:100%;padding:14px;border-radius:10px;border:0;background:#38bdf8;color:#000;font-weight:800;margin-top:10px}.ok{background:#22c55e;color:#000;padding:3px 8px;border-radius:99px;font-size:11px;font-weight:800}</style></head><body><h2>Oráculo BR v7.1 FINAL ✅</h2><div class="card"><span class="ok">7 MUNICÍPIOS DEMO</span> Japaratinga 6,07 corrigido - biblioteca completa em /biblioteca</div><div class="card"><select id="m"></select><input id="a" value="6,07"><button id="b">Analisar</button></div><div id="o"></div><script>const BIB=[{municipio:"JAPARATINGA",modulo_fiscal_ha:7,fracao_minima_parcelamento_ha:2,fonte:"INCRA IE 5/2022 - MF 7 FMP 2 - CORRIGIDO v7.1"},{municipio:"MACEIO",modulo_fiscal_ha:10,fracao_minima_parcelamento_ha:2,fonte:"INCRA IE 5/2022"},{municipio:"MARAGOGI",modulo_fiscal_ha:14,fracao_minima_parcelamento_ha:2,fonte:"INCRA IE 5/2022"},{municipio:"PORTO CALVO",modulo_fiscal_ha:10,fracao_minima_parcelamento_ha:2,fonte:"INCRA IE 5/2022"},{municipio:"TEOTONIO VILELA",modulo_fiscal_ha:35,fracao_minima_parcelamento_ha:4,fonte:"INCRA IE 5/2022"},{municipio:"TRAIPU",modulo_fiscal_ha:30,fracao_minima_parcelamento_ha:4,fonte:"INCRA IE 5/2022"},{municipio:"VICOSA",modulo_fiscal_ha:16,fracao_minima_parcelamento_ha:4,fonte:"INCRA IE 5/2022"}];const s=document.getElementById('m');s.innerHTML='<option value="">Selecione...</option>'+BIB.slice().sort((x,y)=>x.municipio.localeCompare(y.municipio)).map(x=>`<option value="${x.municipio}" ${x.municipio==='JAPARATINGA'?'selected':''}>${x.municipio} - MF ${x.modulo_fiscal_ha} / FMP ${x.fracao_minima_parcelamento_ha}</option>`).join('');document.getElementById('b').onclick=()=>{const mun=document.getElementById('m').value;const area=parseFloat(document.getElementById('a').value.replace(',','.'));const d=BIB.find(x=>x.municipio===mun);const mf=d.modulo_fiscal_ha,fmp=d.fracao_minima_parcelamento_ha;const q=area/mf;let cls='';if(area<fmp)cls='ABAIXO FMP - Minifúndio';else if(area<=4*mf)cls='PEQUENA PROPRIEDADE';else if(area<=15*mf)cls='MÉDIA PROPRIEDADE';else cls='GRANDE PROPRIEDADE';document.getElementById('o').innerHTML=`<div class=card><h3>${mun}/AL - ${cls}</h3><p>MF:${mf} FMP:${fmp} Área:${area} = ${q.toFixed(3)} MF</p><p>${mun==='JAPARATINGA'&&area===6.07?'<span class=ok>CORRIGIDO v7.1 FINAL</span> Japaratinga 6,07 = PEQUENA (antes Minifúndio)':''}</p><p style="font-weight:800;color:#38bdf8">${cls}</p><small>${d.fonte}</small></div>`;};</script></body></html>
