<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Oráculo Imobiliário BR v7.2</title>

  <style>
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
      background: #0f172a;
      color: #e2e8f0;
      max-width: 800px;
      margin: auto;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 16px;
      margin: 12px 0;
    }

    .top {
      background: linear-gradient(135deg, #0ea5e9, #22c55e);
      color: #001;
      font-weight: 800;
    }

    label {
      display: block;
      margin-top: 12px;
      font-weight: 700;
    }

    select,
    input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #0b1220;
      color: #fff;
      font-size: 16px;
      margin-top: 6px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 0;
      background: #38bdf8;
      color: #001;
      font-weight: 900;
      margin-top: 16px;
      cursor: pointer;
      font-size: 16px;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .ok {
      background: #22c55e;
      color: #000;
      padding: 3px 9px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 900;
    }

    .erro {
      border-color: #ef4444 !important;
      background: #450a0a !important;
      color: #fecaca;
    }

    .muted {
      color: #94a3b8;
      font-size: 13px;
    }

    h2 {
      margin-bottom: 8px;
    }
  </style>
</head>

<body>
  <h2>Oráculo Imobiliário BR v7.2</h2>

  <div class="card top">
    102 MUNICÍPIOS DE ALAGOAS | Fonte: INCRA IE 5/2022
  </div>

  <div class="card">
    <label for="m">Município (Alagoas)</label>
    <select id="m" disabled>
      <option value="">Carregando biblioteca oficial...</option>
    </select>

    <label for="a">Área em hectares</label>
    <input
      id="a"
      type="text"
      value="6,07"
      inputmode="decimal"
      placeholder="Ex.: 6,07"
    >

    <button id="b" type="button" disabled>Carregando...</button>

    <div class="muted" id="status" style="margin-top: 10px">
      Inicializando biblioteca...
    </div>
  </div>

  <div id="o" aria-live="polite"></div>

  <script>
    let BIB = [];

    const seletorMunicipio = document.getElementById("m");
    const campoArea = document.getElementById("a");
    const resultado = document.getElementById("o");
    const status = document.getElementById("status");
    const botao = document.getElementById("b");

    function escaparHtml(valor) {
      return String(valor)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function normalizarBiblioteca(lista) {
      return lista
        .map((item) => ({
          municipio: String(item.municipio || "")
            .trim()
            .toUpperCase(),
          modulo_fiscal_ha: Number(item.modulo_fiscal_ha),
          fracao_minima_parcelamento_ha: Number(
            item.fracao_minima_parcelamento_ha
          ),
          fonte: item.fonte_normativa || item.fonte || "INCRA IE 5/2022",
          versao: item.versao_base || ""
        }))
        .filter((item) =>
          item.municipio &&
          item.modulo_fiscal_ha > 0 &&
          item.fracao_minima_parcelamento_ha > 0
        );
    }

    function mostrarErro(mensagem) {
      resultado.innerHTML = `
        <div class="card erro">
          <strong>⚠️ ${escaparHtml(mensagem)}</strong>
        </div>
      `;
    }

    function renderizarMunicipios() {
      const municipios = BIB
        .slice()
        .sort((a, b) => a.municipio.localeCompare(b.municipio));

      seletorMunicipio.innerHTML =
        '<option value="">Selecione...</option>' +
        municipios
          .map(
            (item) => `
              <option
                value="${escaparHtml(item.municipio)}"
                ${item.municipio === "JAPARATINGA" ? "selected" : ""}
              >
                ${escaparHtml(item.municipio)} -
                MF ${item.modulo_fiscal_ha} ha /
                FMP ${item.fracao_minima_parcelamento_ha} ha
              </option>
            `
          )
          .join("");

      const japaratinga = BIB.find(
        (item) => item.municipio === "JAPARATINGA"
      );

      seletorMunicipio.disabled = false;
      botao.disabled = false;
      botao.textContent = "Analisar imóvel";

      status.innerHTML = `
        <span class="ok">Biblioteca carregada: ${BIB.length} municípios</span>
        | JAPARATINGA: MF ${japaratinga.modulo_fiscal_ha} ha /
        FMP ${japaratinga.fracao_minima_parcelamento_ha} ha
      `;
    }

    async function carregarBiblioteca() {
      try {
        const resposta = await fetch(
          "biblioteca/BR/AL/alagoas.json",
          { cache: "no-store" }
        );

        if (!resposta.ok) {
          throw new Error(`Erro HTTP ${resposta.status}`);
        }

        const json = await resposta.json();
        const lista = Array.isArray(json) ? json : (json.municipios || []);

        if (lista.length !== 102) {
          throw new Error(
            `Biblioteca deve conter 102 municípios; encontrados: ${lista.length}`
          );
        }

        BIB = normalizarBiblioteca(lista);

        if (BIB.length !== 102) {
          throw new Error(
            "Biblioteca possui municípios com MF ou FMP inválidos"
          );
        }

        const japaratinga = BIB.find(
          (item) => item.municipio === "JAPARATINGA"
        );

        if (
          !japaratinga ||
          japaratinga.modulo_fiscal_ha !== 7 ||
          japaratinga.fracao_minima_parcelamento_ha !== 2
        ) {
          throw new Error(
            "Dados de JAPARATINGA divergentes: esperado MF 7 ha e FMP 2 ha"
          );
        }

        renderizarMunicipios();
      } catch (erro) {
        BIB = [];
        seletorMunicipio.innerHTML =
          '<option value="">Biblioteca indisponível</option>';
        seletorMunicipio.disabled = true;
        botao.disabled = true;
        botao.textContent = "Biblioteca indisponível";

        status.innerHTML = `
          <div class="card erro">
            <strong>Falha ao carregar a biblioteca.</strong><br>
            ${escaparHtml(erro.message)}<br><br>
            Verifique o arquivo:
            <code>biblioteca/BR/AL/alagoas.json</code>
          </div>
        `;
      }
    }

    botao.addEventListener("click", () => {
      resultado.innerHTML = "";

      const municipio = seletorMunicipio.value;
      const valorDigitado = campoArea.value.trim();
      const area = Number(valorDigitado.replace(",", "."));

      if (!municipio) {
        mostrarErro("Selecione um município");
        return;
      }

      if (
        valorDigitado === "" ||
        !Number.isFinite(area) ||
        area <= 0
      ) {
        mostrarErro("Digite uma área válida maior que 0");
        return;
      }

      const dados = BIB.find(
        (item) => item.municipio === municipio
      );

      if (!dados) {
        mostrarErro("Município não encontrado na biblioteca");
        return;
      }

      const mf = dados.modulo_fiscal_ha;
      const fmp = dados.fracao_minima_parcelamento_ha;
      const quantidadeMF = area / mf;

      let classificacao = "";
      let abaixoFmp = false;

      if (area < fmp) {
        classificacao = `ABAIXO DA FMP — abaixo de ${fmp} ha`;
        abaixoFmp = true;
      } else if (quantidadeMF <= 4) {
        classificacao = "PEQUENA PROPRIEDADE";
      } else if (quantidadeMF <= 15) {
        classificacao = "MÉDIA PROPRIEDADE";
      } else {
        classificacao = "GRANDE PROPRIEDADE";
      }

      const casoJaparatinga =
        municipio === "JAPARATINGA" &&
        Math.abs(area - 6.07) < 0.001;

      resultado.innerHTML = `
        <div class="card">
          <h3>
            ${escaparHtml(municipio)}/AL —
            ${escaparHtml(classificacao)}
          </h3>

          <p>
            MF: <strong>${mf} ha</strong> |
            FMP: <strong>${fmp} ha</strong> |
            Área: <strong>${area} ha</strong> =
            <strong>${quantidadeMF.toFixed(3)} MF</strong>
          </p>

          ${
            casoJaparatinga
              ? `
                <div class="card" style="background:#052e16;border-color:#22c55e">
                  <strong>✅ JAPARATINGA 6,07 ha:</strong>
                  6,07 ÷ 7 = 0,867 MF. Como a área é igual ou superior
                  à FMP de 2 ha e está dentro de 4 MF, a classificação é
                  <strong>PEQUENA PROPRIEDADE</strong>.
                </div>
              `
              : ""
          }

          <p style="font-weight:900;color:#38bdf8;font-size:18px">
            ${escaparHtml(classificacao)}
          </p>

          <p class="muted">
            ${
              abaixoFmp
                ? `Em regra, a área não atende ao parâmetro mínimo da FMP de ${fmp} ha; requer análise jurídica, registral e técnica.`
                : `A área atende ao parâmetro mínimo da FMP de ${fmp} ha. Isso não substitui análise jurídica, registral, técnica ou administrativa do caso concreto.`
            }
          </p>

          <small class="muted">
            Fonte: ${escaparHtml(dados.fonte)}
            ${dados.versao ? ` | Base: ${escaparHtml(dados.versao)}` : ""}
            | Análise orientativa.
          </small>
        </div>
      `;
    });

    carregarBiblioteca();
  </script>
</body>
</html>
