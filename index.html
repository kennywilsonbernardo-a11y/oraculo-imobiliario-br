<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ORACULO BR - CRECI 2468-AL-BR</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-zinc-950 text-white p-4">
<header class="flex justify-between border-b border-zinc-800 pb-2 mb-4">
<div><h1 class="font-black">ORACULO IMOBILIARIO BR</h1><p class="text-xs text-zinc-400">Due diligence</p></div>
<div class="text-right"><b class="text-amber-400">KENNY WILSON</b><br><span class="text-xs">CRECI 2468-AL-BR</span></div>
</header>
<div id="lista"></div>
<div id="detalhe" class="hidden mt-4 bg-zinc-900 p-4 rounded"><h3 id="d-nome" class="text-amber-400 font-black"></h3><p id="d-risco"></p><p id="d-solucao"></p><button onclick="gerar()" class="bg-amber-400 text-black w-full py-3 mt-3 font-black rounded">GERAR LAUDO CRECI 2468</button><textarea id="laudo" class="hidden w-full h-32 bg-black text-xs mt-2"></textarea></div>
<footer class="text-center text-xs text-zinc-600 mt-8">Kenny Wilson - CRECI 2468-AL-BR - Marechal Deodoro AL 2026</footer>
<script>
const F=[{n:1,nome:"Posse Pura",r:"ALTISSIMO",s:"Usucapiao"},{n:2,nome:"Recibo Gaveta",r:"ALTO",s:"Escritura"},{n:3,nome:"Escritura sem Registro",r:"MEDIO-ALTO",s:"Registrar"},{n:4,nome:"Contrato",r:"MEDIO",s:"Escritura definitiva"},{n:5,nome:"Financiado",r:"MEDIO",s:"Quitacao"},{n:6,nome:"Inventario",r:"MEDIO-ALTO",s:"Partilha"},{n:7,nome:"Leilao",r:"ALTO",s:"Carta"},{n:8,nome:"Registrado",r:"BAIXO",s:"OK"}];
let sel=null;
function render(){document.getElementById('lista').innerHTML=F.map(f=>`<button onclick="selFunc(${f.n})" class="w-full text-left bg-zinc-800 p-3 mb-2 rounded">${f.n} - ${f.nome} - ${f.r}</button>`).join('');}
function selFunc(n){sel=F.find(x=>x.n==n);document.getElementById('detalhe').classList.remove('hidden');document.getElementById('d-nome').innerText=sel.nome;document.getElementById('d-risco').innerText='RISCO: '+sel.r;document.getElementById('d-solucao').innerText='Solucao: '+sel.s;}
function gerar(){const t=`*LAUDO ORACULO BR* Imovel: ${sel.nome} Risco: ${sel.r} Solucao: ${sel.s} Gerado por Kenny Wilson - CRECI 2468-AL-BR`;document.getElementById('laudo').value=t;document.getElementById('laudo').classList.remove('hidden');navigator.clipboard?.writeText(t);alert('Laudo CRECI 2468-AL-BR copiado!');}
render();
</script></body></html>
